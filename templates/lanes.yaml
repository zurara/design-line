# design-line lane configuration. One block per lane. Paths may start with ~ or be relative to the workspace root.
# Written by /design-line:init; edit by hand any time. Keep organization facts (people, IDs, tools) in org.md, not here.
version: 1
ledger: _line/ledger.md
board: ""                        # optional: URL of a published copy of the board for phones; the local _line/board.html is always rendered
budget:                          # set by /design-line:init from the designer's plan; everything optional is off on a small plan
  plan: ""                       # pro | max5 | max20 | api | team | other   (what the designer pays for; drives the defaults below)
  weekly_tokens: 0               # rough subagent-token budget per week, 0 = not tracked; usage-report shows the week's total against it
  board: off                     # on | off   on = also push the snapshot to the board: URL (artifact); off = local _line/board.html only
  parallel: 3                    # tasks the dispatcher runs at once across all lanes
  readers: fold                  # fold | lean | on
                                 #   fold = the coordinator reads the sources itself (bounded, no reader subagent); fewer handoffs, nothing lost in a summary
                                 #   lean = one reader per task, 400 words;  on = one reader per source. Compare with usage-report.mjs (it groups by this setting)
  default_model: opus            # the writer/coordinator model when a lane does not say; a small plan sets sonnet
  max_shots: 8                   # screenshots a checker may take per check; gate and DOM measurements are the normal proof, pictures only for what the brief marks for the designer's eyes
trailer: "Co-Authored-By: Claude <noreply@anthropic.com>"   # default for merge commits; a session sets DESIGN_LINE_TRAILER to the line for the model it actually runs on

lanes:
  - id: example-code
    name: Component library
    kind: code                      # code | design-tool | prototype | docs | ledger
    notes: _line/lanes/example-code/notes.md      # optional; the inbox, ledger and briefs hold the state
    repo: ~/code/components
    main: main
    worktrees: .claude/worktrees    # relative to repo; one task, one worktree
    ports: [6006, 6007, 6008]       # ports this lane may use; stop them by port only
    sources:                        # what readers read before a brief
      - kind: code
        path: ~/code/components
      - kind: design-tool
        ref: "<design file key or URL>"
    rules:                          # files a writer must read whole before the first edit
      - _line/rules/components.md
    defaults: _line/rules/components-defaults.md   # known unknowns and what to do without asking; briefs copy the lines that apply
    shared_files:                   # only the coordinator writes these, and last
      - docs/CHANGELOG.md
    gate:
      setup: "yarn install && yarn build"
      serve: ""                     # optional: a server the gate needs, started in the worktree by gate.sh and stopped by port after, e.g. "sh tools/serve.sh {port}"
      port: 0
      command: "yarn test && yarn lint && yarn tsc --noEmit"
      pass: "0 failed"              # a substring the gate output must contain, or omit to rely on exit code
    ship:
      mode: pr                      # pr | merge | publish | none
      approval: designer            # designer | coordinator
      deploy_check: ""              # optional command whose output must contain "success", e.g. "gh run list -L 1 --branch main"
    roles:
      reader:
        model: sonnet
        effort: medium
      writer:
        model: sonnet                 # the default; a brief marks `writer_model: opus` for new behaviour, a new component, drawing in a design tool, or work the designer iterates on
        effort: medium
      checker:
        model: sonnet
        effort: medium
    limits:
      sessions: 3                   # task sessions open at once in this lane (the coordinator does not count)
      single_writer: true           # writers on the same files run one after another

  - id: example-prototype
    name: Prototypes
    kind: prototype
    notes: _line/lanes/example-prototype/notes.md
    repo: ~/code/prototypes
    main: main
    worktrees: .claude/worktrees
    ports: [8766, 8767, 8781]
    sources:
      - kind: code
        path: ~/code/prototypes
      - kind: planning-tool
        ref: "<board or database id>"
    rules:
      - _line/rules/prototypes.md
    gate:
      setup: ""
      serve: "sh tools/serve.sh {port}"
      port: 8781
      command: "npm run verify"
      pass: "0 failed"
    ship:
      mode: merge                   # the coordinator merges gated branches into main
      approval: coordinator
      deploy_check: "gh run list -L 10 --branch main --json headSha,status,conclusion --jq '.[] | select(.headSha==\"{sha}\") | \"\\(.status) \\(.conclusion)\"'"   # {sha} = the pushed merge commit; passes on "completed success"
    roles:
      reader:
        model: sonnet
        effort: medium
      writer:
        model: sonnet
        effort: medium
      checker:
        model: sonnet
        effort: medium
    limits:
      sessions: 3
      single_writer: true

  - id: ledger
    name: Work items
    kind: ledger                    # optional: reconciles the ledger with the planning tool; writes there only after the designer's yes
    notes: _line/lanes/ledger/notes.md
    sources:
      - kind: planning-tool
        ref: "<work items database>"
    ship:
      mode: publish
      approval: designer
    roles:
      reader:
        model: sonnet
        effort: medium
