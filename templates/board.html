<meta charset="utf-8">
<title>Line board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: kanban, five columns that scroll sideways on a phone (scroll-snap) and sit side by side on a desk; each card = one task,
   with the subagents working on it as an icon row. Reads one db doc, board/state. */
:root{--bg:#FFFFFF; --panel:#F4F4F4; --panel2:#FFFFFF; --ink:#1A1A1A; --ink2:#8A8A8A; --line:#E3E3E3; --line2:#EEEEEE;--accent:#1A1A1A;--ok:#22A06B;--warn:#D6A531;--run:#3B82F6;
  --l0:#3B82F6;--l1:#EC4899;--l2:#1F1F1F;--l3:#F59E0B;--l4:#22A06B;--l5:#8A8A8A;
  --display:"Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif;--body:"Inter","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141414; --panel:#1E1E1E; --panel2:#191919; --ink:#F0F0F0; --ink2:#9A9A9A; --line:#2C2C2C; --line2:#262626;--accent:#F0F0F0;--ok:#4CC38A;--warn:#E0B64A;--run:#6AA1FF;--l0:#6AA1FF;--l1:#F472B6;--l2:#E6E6E6;--l3:#FBBF24;--l4:#4CC38A;--l5:#9A9A9A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414; --panel:#1E1E1E; --panel2:#191919; --ink:#F0F0F0; --ink2:#9A9A9A; --line:#2C2C2C; --line2:#262626;--accent:#F0F0F0;--ok:#4CC38A;--warn:#E0B64A;--run:#6AA1FF;--l0:#6AA1FF;--l1:#F472B6;--l2:#E6E6E6;--l3:#FBBF24;--l4:#4CC38A;--l5:#9A9A9A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1{font-weight:600;margin:0;font-size:22px;line-height:1.3;letter-spacing:-.01em}
header{padding-block:36px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.upd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}.dot.live{background:var(--ok)}
.legend{display:flex;gap:10px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center;padding-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:15px;height:15px;color:var(--ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;align-items:start;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
@media (max-width:700px){.board{grid-auto-columns:100%;gap:0}.col{scroll-snap-stop:always}}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.nav::-webkit-scrollbar{display:none}
.nav button,.tags button{font-family:var(--body);font-size:12.5px;border:0;background:var(--panel);color:var(--ink2);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.nav button i{width:7px;height:7px;border-radius:50%;display:inline-block}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.nav button .n{font-family:var(--mono);font-size:11px}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.tags button[aria-pressed="true"]{background:var(--ink);color:var(--panel2);border-color:var(--ink)}
.tags .lbl{font-family:var(--mono);font-size:11px;color:var(--ink2);align-self:center;margin-right:2px}
.card .tag{color:var(--ink2);text-transform:none;letter-spacing:0}
@media (min-width:701px){.nav{display:none}}
.col{background:transparent;border:0;display:flex;flex-direction:column;min-width:0;scroll-snap-align:start}
.col h2{font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0;padding:6px 2px 10px;display:flex;align-items:center;gap:8px}
.col h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink3,#B5B5B5);font-weight:400}
.col h2 i{width:8px;height:8px;border-radius:50%;display:inline-block}
.col.wait h2 i{background:var(--accent)}.col.queue h2 i{background:var(--line)}.col.run h2 i{background:var(--run)}.col.ready h2 i{background:var(--warn)}.col.done h2 i{background:var(--ok)}
.cards{display:grid;gap:10px;padding:0 2px 8px;align-content:start}
.card{background:var(--panel2);border:0;border-radius:10px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.card .m{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:500}
.card .m .lane{color:var(--ink2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.card .m .lane::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lc)}
.card .t{font-weight:500;font-size:14px;overflow-wrap:anywhere;line-height:1.45;text-transform:none;letter-spacing:0}
.card .w{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere;text-transform:none;letter-spacing:0}
.workers{display:grid;gap:4px;margin-top:6px;padding-top:10px;border-top:1px solid var(--panel2)}
.wk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);padding:2px 0}
.wk .st{color:var(--ink2);font-size:11.5px;margin-left:auto}
.wk svg{width:16px;height:16px;flex:none;color:var(--ink)}
.wk .s{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.wk.running .s{background:var(--run);animation:pulse 1.4s ease-in-out infinite}.wk.done .s{background:var(--ok)}.wk.paused .s{background:var(--accent)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.wk.running .s{animation:none}}
.empty{color:var(--ink3,#B5B5B5);font-size:12.5px;padding:14px 2px}
.lanes{margin-top:36px}
details{background:var(--panel);border:0;border-radius:10px;padding:8px 12px;margin-top:6px}
summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
summary i{width:10px;height:10px;border-radius:50%;display:inline-block}
summary .m{font-size:11px;color:var(--ink2);font-weight:400}
details pre{white-space:pre-wrap;font:12px/1.5 var(--mono);color:var(--ink);margin:8px 0 2px;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--ink2);margin-top:12px}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coordinator" viewBox="0 0 16 16"><path d="M3 2.5h10v11H3z M5.5 2.5v-1h5v1 M5.5 7h5 M5.5 9.5h5 M5.5 12h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  <symbol id="i-reader" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="4.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 10l4 4 M5 6.8h3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-writer" viewBox="0 0 16 16"><path d="M3 13l1-3.5 7.5-7.5 2.5 2.5L6.5 12z M10.5 3l2.5 2.5 M3 13h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-checker" viewBox="0 0 16 16"><path d="M2 11.5L8 3l6 8.5z M5 11.5v-2 M8 11.5v-3.5 M11 11.5v-2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  <symbol id="i-ledger" viewBox="0 0 16 16"><path d="M3.5 2h8a1 1 0 0 1 1 1v11H4.5a1 1 0 0 1-1-1z M5.5 2v12 M8 5.5h3 M8 8h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  <symbol id="i-dispatcher" viewBox="0 0 16 16"><path d="M2 10h12 M3.5 7h3v3h-3z M9.5 5.5h3V10h-3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="4" cy="12.5" r="1" fill="currentColor"/><circle cx="8" cy="12.5" r="1" fill="currentColor"/><circle cx="12" cy="12.5" r="1" fill="currentColor"/></symbol>
  <symbol id="i-designer" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
</svg>
<header><div><div class="upd"><span class="dot" id="dot"></span><span id="updt">…</span></div><h1 id="title">Line board</h1></div></header>
<div class="legend" id="legend"></div>
<div class="tags" id="tags" hidden></div>
<div class="nav" id="nav"></div>
<div class="board" id="board"></div>
<div class="lanes" id="lanes"></div>
<p class="note" id="note"></p>
<script>
(async function(){
const zh=(navigator.language||'').toLowerCase().startsWith('zh');
const L=zh?{title:'流水线看板',cols:{wait:'等你',queue:'排队',run:'在跑',ready:'等你说出货',done:'做完'},empty:'空',noData:'还没有数据。调度员第一次写 board/state 以后这里会亮。',off:'这个链接看不到数据库。',updated:'更新于',
  roles:{coordinator:'协调',reader:'读',writer:'写',checker:'查',ledger:'账本',dispatcher:'调度',designer:'你'},ws:{queued:'排队',running:'在跑',done:'完',paused:'停下',ready:'等你'},
  note:'只读。调度员在每个状态变化时写一次 board/state，收工时再写一次。要回答停下的任务，用 Remote Control 进调度员的会话。',blocks:'挡住',lanesH:'每条线挂着的事',inboxFrom:'来自'}
:{title:'Line board',cols:{wait:'Waiting for you',queue:'Queued',run:'Running',ready:'Ready to ship',done:'Done'},empty:'empty',noData:'No data yet. This lights up after the dispatcher first writes board/state.',off:'Database not reachable from this view.',updated:'updated',
  roles:{coordinator:'coordinate',reader:'read',writer:'write',checker:'check',ledger:'ledger',dispatcher:'dispatch',designer:'you'},ws:{queued:'queued',running:'running',done:'done',paused:'paused',ready:'needs you'},
  note:'Read-only. The dispatcher writes board/state once per state change and once at close. To answer a paused task, Remote Control into the dispatcher session.',blocks:'blocks',lanesH:'Open items per lane',inboxFrom:'from'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ICON=r=>`<svg><use href="#i-${['coordinator','reader','writer','checker','ledger','dispatcher','designer'].includes(r)?r:'coordinator'}"/></svg>`;
$('title').textContent=L.title;document.title=L.title;$('note').textContent=L.note;
$('legend').innerHTML=Object.entries(L.roles).map(([r,t])=>`<span>${ICON(r)}${esc(t)}</span>`).join('');
const laneColor={};let activeTag=null,lastDoc=null;
const TAG=/#([\p{L}\p{N}_-]+)/gu;const tagsOf=t=>[...String(t||'').matchAll(TAG)].map(m=>m[1]);
function card(c){const tg=tagsOf(c.title+' '+(c.note||''));return `<div class="card" style="--lc:${laneColor[c.lane]||'var(--l5)'}"><div class="m"><span class="lane">${esc(c.lane)}</span>${tg.map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}${c.meta.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="t">${esc(c.title.replace(TAG,'').replace(/\s{2,}/g,' ').trim())}</div>${c.note?`<div class="w">${esc(c.note)}</div>`:''}${c.workers&&c.workers.length?`<div class="workers">${c.workers.map(w=>`<span class="wk ${esc(w.state||'')}" title="${esc(w.note||'')}">${ICON(w.role)}${esc(w.name||L.roles[w.role]||w.role)}<span class="st">${esc(L.ws[w.state]||w.state||'')}</span><span class="s"></span></span>`).join('')}</div>`:''}</div>`}
function col(key,cards){cards=activeTag?cards.filter(c=>tagsOf(c.title+' '+(c.note||'')).includes(activeTag)):cards;return `<section class="col ${key}" id="col-${key}"><h2><i></i>${esc(L.cols[key])}<span class="n">${cards.length}</span></h2><div class="cards">${cards.length?cards.map(card).join(''):`<div class="empty">${esc(L.empty)}</div>`}</div></section>`}
function render(d){lastDoc=d;
  if(!d){$('board').innerHTML=`<div class="empty" style="grid-column:1/-1">${esc(L.noData)}</div>`;return}
  const tasks=d.tasks||[],inbox=d.inbox||[],ledger=d.ledger||[],lanes=d.lanes||[];
  lanes.forEach((l,i)=>laneColor[l.id]=`var(--l${i%6})`);
  const upd=new Date(d.updated);$('updt').textContent=`${L.updated} ${isNaN(upd)?'':upd.toLocaleString()}`;
  const T=s=>tasks.filter(t=>t.state===s).map(t=>({lane:t.lane,title:t.title,note:t.note,meta:[t.id,t.updated||t.since||'',t.usage?`${t.usage.tokens>=1000?(t.usage.tokens/1000).toFixed(0)+'k':t.usage.tokens} tok · ${t.usage.models.join('+')}`:''].filter(Boolean),workers:t.workers||[]}));
  const inboxWait=inbox.filter(i=>(i.blocks&&i.blocks!=='-')||/等你|waiting|paused|needs you/i.test(i.what));
  const inboxRest=inbox.filter(i=>!inboxWait.includes(i));
  const I=arr=>arr.map(i=>({lane:i.lane,title:i.what,note:'',meta:[i.date,(i.blocks&&i.blocks!=='-')?`${L.blocks} ${i.blocks}`:'',i.from?`${L.inboxFrom} ${i.from}`:''].filter(Boolean),workers:[{role:'designer',name:L.roles.designer,state:'paused'}]}));
  const doneT=T('done'),doneL=ledger.slice(0,15).map(r=>({lane:r.lane,title:r.what,note:r.ref&&r.ref!=='-'?r.ref:'',meta:[r.time,r.item&&r.item!=='-'?r.item:''].filter(Boolean),workers:[]}));
  $('board').innerHTML=col('wait',[...T('paused'),...I(inboxWait)])+col('queue',[...T('queued'),...I(inboxRest).map(c=>({...c,workers:[]}))])+col('run',T('running'))+col('ready',T('ready'))+col('done',[...doneT,...doneL]);
  const all=[...tasks.map(t=>t.title+' '+(t.note||'')),...inbox.map(i=>i.what)].flatMap(tagsOf);const tags=[...new Set(all)].sort();
  const tg=$('tags');tg.hidden=!tags.length;tg.innerHTML=tags.length?`<span class="lbl">#</span>`+tags.map(t=>`<button aria-pressed="${activeTag===t}" data-tag="${esc(t)}">${esc(t)}</button>`).join(''):'';
  tg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeTag=activeTag===b.dataset.tag?null:b.dataset.tag;render(lastDoc)}));
  const counts={};$('board').querySelectorAll('.col').forEach(c=>counts[c.id.slice(4)]=c.querySelector('.n').textContent);
  $('nav').innerHTML=Object.keys(L.cols).map(k=>`<button data-col="${k}"><i style="background:${{wait:'var(--accent)',queue:'var(--line)',run:'var(--run)',ready:'var(--warn)',done:'var(--ok)'}[k]}"></i>${esc(L.cols[k])}<span class="n">${counts[k]||0}</span></button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>$('col-'+b.dataset.col).scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'})));
  markNav();
  $('lanes').innerHTML=`<h2 style="font-family:var(--display);font-size:18px;margin:0 0 4px">${esc(L.lanesH)}</h2>`+lanes.map((l,i)=>`<details><summary><i style="background:var(--l${i%6})"></i>${esc(l.name)}<span class="m">${esc(l.ship)} / ${esc(l.approval)} · ${esc(l.updated)}</span></summary><pre>${esc(l.open||'')}</pre></details>`).join('');
}
function markNav(){const b=$('board');const cols=[...b.querySelectorAll('.col')];if(!cols.length)return;const x=b.scrollLeft+b.clientWidth/2;const cur=cols.find(c=>c.offsetLeft<=x&&c.offsetLeft+c.offsetWidth>x)||cols[0];$('nav').querySelectorAll('button').forEach(n=>n.setAttribute('aria-current',String(n.dataset.col===cur.id.slice(4))))}
$('board').addEventListener('scroll',()=>{clearTimeout(window.__nt);window.__nt=setTimeout(markNav,80)},{passive:true});
render(null);
const db=await claude.use('db');
if(!db){$('updt').textContent=L.off;return}
db.doc('board/state').onSnapshot(s=>{$('dot').classList.add('live');render(s.exists?s.data():null)},e=>{$('updt').textContent=e.message||e.code});
})();
</script>
